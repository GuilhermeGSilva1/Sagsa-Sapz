<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAGSA - Gerenciador de SAPZ</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8f9fa; margin: 0; padding: 0; }
        header { background: #004085; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        h2 { color: #004085; margin-top: 0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #495057; }
        input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; }
        textarea { height: 80px; resize: vertical; }
        .btn-primary { background: #0056b3; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #dee2e6; vertical-align: middle; }
        th { background: #e9ecef; color: #495057; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #17a2b8; color: white; white-space: nowrap; }
        .desc-preview { max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #495057; }
        .acoes-cell { display: flex; gap: 6px; white-space: nowrap; }
        .btn-ver { background: #0056b3; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-ver:hover { background: #004085; }
        .btn-excluir { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-excluir:hover { background: #b02a37; }

        /* Modal de Descrição */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.ativo { display: flex; }
        .modal-content {
            background: white;
            border-radius: 8px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-header h3 { margin: 0; color: #004085; font-size: 19px; }
        .modal-close {
            background: transparent;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            color: #6c757d;
        }
        .modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #f8f9fa;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #495057;
        }
        .modal-section { margin-bottom: 16px; }
        .modal-section h4 { margin: 0 0 6px 0; color: #004085; font-size: 15px; }
        .modal-section p {
            margin: 0;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #0056b3;
            color: #212529;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .modal-footer { text-align: right; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>SAGSA - Sistema Gerador de SAPZ</h1>
        <div class="user-info">
            <span id="userDisplay">Carregando...</span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </header>

    <div class="container">
        <!-- Cadastrar Nova SAPZ -->
        <div class="card">
            <h2>Nova Situação de Aprendizagem (SAPZ)</h2>
            <form id="sapzForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título da SAPZ</label>
                        <input type="text" id="titulo" required placeholder="Ex: Projeto Integrador de Redes">
                    </div>
                    <div class="form-group">
                        <label for="tipoEstrategia">Estratégia Didática</label>
                        <select id="tipoEstrategia" required>
                            <option value="SITUACAO_PROBLEMA">Situação Problema</option>
                            <option value="ESTUDO_CASO">Estudo de Caso</option>
                            <option value="PROJETO">Projeto</option>
                            <option value="PESQUISA_APLICADA">Pesquisa Aplicada</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="unidadeCurricularId">ID Unidade Curricular</label>
                        <input type="number" id="unidadeCurricularId" required value="1">
                    </div>
                    <div class="form-group">
                        <label for="cargaHorariaSa">Carga Horária (horas - máx. 408h)</label>
                        <input type="number" id="cargaHorariaSa" required value="20" min="1" max="408">
                    </div>
                    <div class="form-group full-width">
                        <label for="contextualizacao">Contextualização (Descrição)</label>
                        <textarea id="contextualizacao" required placeholder="Descrição do cenário de aprendizagem..."></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label for="desafio">Desafio proposto ao aluno</label>
                        <textarea id="desafio" required placeholder="Qual o problema/desafio a ser resolvido..."></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label for="resultadosEsperados">Resultados Esperados</label>
                        <textarea id="resultadosEsperados" required placeholder="Entregáveis solicitados..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Salvar SAPZ</button>
            </form>
        </div>

        <!-- Lista de SAPZs -->
        <div class="card">
            <h2>Situações de Aprendizagem Cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Descrição</th>
                        <th>Estratégia</th>
                        <th>Carga Horária</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="sapzTableBody">
                    <tr><td colspan="6" style="text-align:center;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para visualizar descrição completa da SAPZ -->
    <div id="modalDescricao" class="modal-overlay" onclick="fecharModalSeClicarFora(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitulo">Detalhes da SAPZ</h3>
                <button class="modal-close" onclick="fecharModalDescricao()" title="Fechar">&times;</button>
            </div>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-section">
                <h4>Contextualização (Descrição)</h4>
                <p id="modalContextualizacao"></p>
            </div>
            <div class="modal-section">
                <h4>Desafio Proposto ao Aluno</h4>
                <p id="modalDesafio"></p>
            </div>
            <div class="modal-section">
                <h4>Resultados Esperados</h4>
                <p id="modalResultados"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="fecharModalDescricao()">Fechar</button>
            </div>
        </div>
    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
